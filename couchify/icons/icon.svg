<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#12121e"/>
      <stop offset="100%" stop-color="#09090f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="couchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="12"/>

  <!-- Stylized Couch Silhouette with Glow -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Couch Backrest -->
    <rect x="110" y="150" width="292" height="150" rx="36" fill="url(#couchGrad)"/>

    <!-- Left Armrest -->
    <rect x="80" y="210" width="60" height="150" rx="28" fill="url(#cushionGrad)"/>

    <!-- Right Armrest -->
    <rect x="372" y="210" width="60" height="150" rx="28" fill="url(#cushionGrad)"/>

    <!-- Main Seat Cushion -->
    <rect x="126" y="255" width="260" height="95" rx="24" fill="url(#couchGrad)"/>

    <!-- Cushion divider line -->
    <line x1="256" y1="258" x2="256" y2="348" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

    <!-- Couch Wooden Legs -->
    <polygon points="120,355 140,355 130,395 110,395" fill="#e2e8f0" opacity="0.8"/>
    <polygon points="372,355 392,355 402,395 382,395" fill="#e2e8f0" opacity="0.8"/>
  </g>

  <!-- Small sync indicator dot (green active badge in top-right) -->
  <circle cx="400" cy="112" r="22" fill="#10b981" stroke="#12121e" stroke-width="8"/>
</svg>
